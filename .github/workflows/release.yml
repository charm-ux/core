name: Release

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm trusted publishing (OIDC) requires npm >= 11.5.1; the npm bundled
      # with Node 20 is older. Pin the 11.x line to guarantee an OIDC-capable
      # npm without tracking npm@latest.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11 && npm --version

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      # Publishing authenticates via OIDC trusted publishers configured on the
      # npm packages — deliberately no NPM_TOKEN/NODE_AUTH_TOKEN so npm cannot
      # fall back to token auth.
      - name: Create Release Pull Request or Publish to npm (main)
        if: github.ref_name == 'main'
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # next branch: snapshot version and publish to beta tag
      - name: Check for pending changesets (next)
        if: github.ref_name == 'next'
        id: changesets-next
        shell: bash
        run: |
          COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Apply snapshot versions (beta)
        if: github.ref_name == 'next' && steps.changesets-next.outputs.count != '0'
        run: pnpm changeset version --snapshot beta

      - name: Publish to npm (beta tag)
        if: github.ref_name == 'next' && steps.changesets-next.outputs.count != '0'
        run: pnpm changeset publish --tag beta --no-git-tag
