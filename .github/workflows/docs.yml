name: Deploy Docs

on:
  push:
    branches:
      - main
      - next

permissions:
  contents: read
  pages: write
  id-token: write

# Shared group: every deploy rebuilds both main and next, so deploys must not overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-main:
    name: Build docs (main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          DOCS_BASE: /core

      - name: Upload main build
        uses: actions/upload-artifact@v4
        with:
          name: docs-main
          path: ./packages/docs/dist
          retention-days: 1

  build-next:
    name: Build docs (next)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next
        uses: actions/checkout@v4
        with:
          ref: next

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          DOCS_BASE: /core/next

      - name: Upload next build
        uses: actions/upload-artifact@v4
        with:
          name: docs-next
          path: ./packages/docs/dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-main, build-next]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download main build
        uses: actions/download-artifact@v4
        with:
          name: docs-main
          path: ./site

      - name: Download next build
        uses: actions/download-artifact@v4
        with:
          name: docs-next
          path: ./site-next

      - name: Combine builds
        run: |
          mkdir -p ./site/next
          cp -R ./site-next/. ./site/next/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
