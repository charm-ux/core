name: Sync main to next

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency: sync-main-to-next

jobs:
  sync:
    name: Merge main into next
    runs-on: ubuntu-latest
    steps:
      - name: Checkout next
        uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Check if next is behind main
        id: behind
        run: |
          COUNT=$(git rev-list --count next..origin/main 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "next is behind main by $COUNT commit(s)"

      - name: Nothing to sync
        if: steps.behind.outputs.count == '0'
        run: echo "next is already up to date with main — nothing to do"

      - name: Attempt direct merge
        if: steps.behind.outputs.count != '0'
        id: merge
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge origin/main --no-ff -m "chore: sync main into next" 2>&1

      - name: Push clean merge
        if: steps.merge.outcome == 'success'
        run: git push

      - name: Commit conflicted state to auto-sync branch
        if: steps.merge.outcome == 'failure'
        run: |
          git add -A
          git commit -m "chore: merge main into next (with conflicts)"
          git push origin HEAD:refs/heads/auto-sync/main-into-next --force

      - name: Restore next to clean state
        if: steps.merge.outcome == 'failure'
        run: git reset --hard origin/next

      - name: Create or update sync PR on conflict
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'chore: merge main into next';
            const body = [
              'Auto-sync from `main` to `next` has a merge conflict.',
              '',
              '**Resolve locally:**',
              '```',
              'git checkout auto-sync/main-into-next',
              'git reset --hard next',
              'git merge main',
              '# fix conflicts',
              'git add -A',
              'git merge --continue',
              'git push --force',
              '```',
            ].join('\n');

            // Look for an existing open sync PR by label
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'next',
              state: 'open',
            });
            const syncPr = pulls.find(pr =>
              pr.labels.some(l => l.name === 'auto-sync')
            );

            if (syncPr) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: syncPr.number,
                title,
                body,
              });
              core.notice(`Updated existing PR #${syncPr.number}`);
              return;
            }

            // Check the auto-sync branch has content
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'next',
              head: 'auto-sync/main-into-next',
            });

            if (comparison.behind_by === 0 && comparison.ahead_by === 0) {
              core.info('auto-sync branch has no diff — no PR needed');
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: 'auto-sync/main-into-next',
              base: 'next',
              body,
              maintainer_can_modify: true,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['auto-sync'],
            });

            core.notice(`Created PR #${pr.number} for conflict resolution`);
